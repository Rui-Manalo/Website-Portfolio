<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Space Grotesk','Inter','DejaVu Sans',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F1720"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F5F6F4"/>
  <text x="800" y="70" text-anchor="middle" font-size="38" font-weight="700" fill="#0F1720">StreamFlix: Raw CSV → OLTP (3NF) → OLAP (Star Schema)</text>
  <text x="800" y="108" text-anchor="middle" font-size="20" fill="#5A6672">Two physically separate DuckDB databases connected by an explicit ETL step</text>

  <!-- Raw CSV -->
  <rect x="30" y="340" width="220" height="230" rx="12" fill="#fff" stroke="#0F1720" stroke-width="2.5"/>
  <text x="140" y="385" text-anchor="middle" font-size="20" font-weight="700" fill="#0F1720">Raw CSV</text>
  <text x="140" y="418" text-anchor="middle" font-size="14" fill="#0F1720" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">streamflix_viewing</text>
  <text x="140" y="438" text-anchor="middle" font-size="14" fill="#0F1720" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">_history.csv</text>
  <text x="140" y="478" text-anchor="middle" font-size="18" font-weight="600" fill="#0F1720">260 rows</text>
  <text x="140" y="506" text-anchor="middle" font-size="15" fill="#5A6672">1 row per watch event</text>
  <text x="140" y="530" text-anchor="middle" font-size="15" fill="#5A6672">one wide, flat table</text>

  <!-- Arrow 1 -->
  <line x1="252" y1="455" x2="346" y2="455" stroke="#0F1720" stroke-width="3" marker-end="url(#ah)"/>
  <text x="299" y="425" text-anchor="middle" font-size="14" fill="#0F1720" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">staging</text>
  <text x="299" y="490" text-anchor="middle" font-size="14" fill="#0F1720" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">+ load</text>

  <!-- OLTP panel -->
  <rect x="350" y="150" width="440" height="610" rx="14" fill="#fff" stroke="#0F1720" stroke-width="2.5"/>
  <path d="M350 164a14 14 0 0 1 14-14h412a14 14 0 0 1 14 14v56H350z" fill="#0F1720"/>
  <text x="570" y="186" text-anchor="middle" font-size="24" font-weight="700" fill="#F5F6F4">MovieOLTP.duckdb</text>
  <text x="570" y="209" text-anchor="middle" font-size="15" fill="#C9CFD4">3NF · 5 tables</text>

  <g fill="#F5F6F4" stroke="#0F1720" stroke-width="2">
    <rect x="375" y="250" width="190" height="90" rx="8"/>
    <rect x="375" y="380" width="190" height="80" rx="8"/>
    <rect x="375" y="490" width="190" height="80" rx="8"/>
    <rect x="595" y="250" width="175" height="80" rx="8"/>
    <rect x="595" y="380" width="175" height="190" rx="8" fill="#E3EAE8"/>
  </g>
  <g fill="#0F1720" font-size="18" font-weight="700" text-anchor="middle">
    <text x="470" y="288">USERS</text>
    <text x="470" y="408" font-size="14.5">USER_SUBSCRIPTION</text>
    <text x="470" y="518">DEVICE</text>
    <text x="682" y="288">MOVIE</text>
    <text x="682" y="470">WATCH_EVENT</text>
  </g>
  <g fill="#5A6672" font-size="13" text-anchor="middle" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
    <text x="470" y="312">PK user_id</text>
    <text x="470" y="430">PK subscription_id</text>
    <text x="470" y="450">FK user_id</text>
    <text x="470" y="540">PK device_id</text>
    <text x="470" y="560">FK user_id</text>
    <text x="682" y="312">PK movie_id</text>
    <text x="682" y="500">PK watch_id</text>
    <text x="682" y="520">FK user_id</text>
    <text x="682" y="538">FK movie_id · device_id</text>
  </g>
  <g stroke="#0F1720" stroke-width="2" fill="none">
    <path d="M368 295V530M368 295H375M368 420H375M368 530H375"/>
    <path d="M565 290H580V430H595"/>
    <path d="M565 530H595"/>
    <path d="M682 330V380"/>
  </g>
  <text x="570" y="625" text-anchor="middle" font-size="15" fill="#0F1720">Natural keys: user_id, movie_id, watch_id</text>
  <text x="570" y="650" text-anchor="middle" font-size="15" fill="#0F1720">Surrogate keys: subscription_id, device_id</text>
  <text x="570" y="685" text-anchor="middle" font-size="15" fill="#5A6672">Subscription isolated to remove the</text>
  <text x="570" y="707" text-anchor="middle" font-size="15" fill="#5A6672">user → plan → price transitive dependency</text>

  <!-- Arrow 2 -->
  <line x1="792" y1="455" x2="926" y2="455" stroke="#0F1720" stroke-width="3" marker-end="url(#ah)"/>
  <text x="859" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#0F1720">ETL</text>
  <text x="859" y="437" text-anchor="middle" font-size="13" fill="#0F1720" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">ATTACH</text>
  <text x="859" y="490" text-anchor="middle" font-size="12" fill="#0F1720" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">OLAP_load.sql</text>

  <!-- OLAP panel -->
  <rect x="930" y="150" width="640" height="610" rx="14" fill="#fff" stroke="#0F1720" stroke-width="2.5"/>
  <path d="M930 164a14 14 0 0 1 14-14h612a14 14 0 0 1 14 14v56H930z" fill="#0F1720"/>
  <text x="1250" y="186" text-anchor="middle" font-size="24" font-weight="700" fill="#F5F6F4">MovieOLAP.duckdb</text>
  <text x="1250" y="209" text-anchor="middle" font-size="15" fill="#C9CFD4">Star schema · 1 fact + 3 dimensions</text>

  <g fill="#F5F6F4" stroke="#0F1720" stroke-width="2">
    <rect x="1120" y="250" width="260" height="90" rx="8"/>
    <rect x="950" y="420" width="170" height="130" rx="8"/>
    <rect x="1380" y="420" width="170" height="130" rx="8"/>
  </g>
  <rect x="1160" y="400" width="180" height="170" rx="8" fill="#0F1720"/>
  <g fill="#0F1720" font-size="17" font-weight="700" text-anchor="middle">
    <text x="1250" y="284">USERS_ACC_SUBS_DIM</text>
    <text x="1035" y="470">MOVIE_DIM</text>
    <text x="1465" y="470">DEVICE_DIM</text>
  </g>
  <g fill="#5A6672" font-size="13" text-anchor="middle" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
    <text x="1250" y="308">PK user_key</text>
    <text x="1250" y="326">+ plan &amp; price</text>
    <text x="1035" y="494">PK movie_key</text>
    <text x="1465" y="494">PK device_key</text>
  </g>
  <text x="1250" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#F5F6F4">WATCH_EVENT</text>
  <text x="1250" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#F5F6F4">_FACT</text>
  <g fill="#C9CFD4" font-size="13" text-anchor="middle" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
    <text x="1250" y="505">watch_id (degenerate)</text>
    <text x="1250" y="525">user_key · movie_key</text>
    <text x="1250" y="545">device_key + measures</text>
  </g>
  <g stroke="#0F1720" stroke-width="2.5">
    <line x1="1250" y1="340" x2="1250" y2="400"/>
    <line x1="1120" y1="485" x2="1160" y2="485"/>
    <line x1="1340" y1="485" x2="1380" y2="485"/>
  </g>
  <text x="1250" y="625" text-anchor="middle" font-size="15" fill="#0F1720">Grain: one row per watch event, measures unmodified</text>
  <text x="1250" y="650" text-anchor="middle" font-size="15" fill="#0F1720">Independent surrogate keys; natural keys kept for traceability</text>
  <text x="1250" y="685" text-anchor="middle" font-size="15" fill="#5A6672">No dimension-to-dimension links:</text>
  <text x="1250" y="707" text-anchor="middle" font-size="15" fill="#5A6672">a true star, not a snowflake</text>

  <!-- Validation -->
  <rect x="30" y="790" width="1540" height="70" rx="12" fill="#0F1720"/>
  <text x="800" y="819" text-anchor="middle" font-size="18" font-weight="700" fill="#F5F6F4">Validation · OLAP_validation.sql</text>
  <text x="800" y="845" text-anchor="middle" font-size="16" fill="#C9CFD4">row counts · key uniqueness · referential integrity · natural key traceability · grain · numeric ranges · business rules · spot check</text>
</svg>
